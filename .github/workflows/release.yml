# Builds solitty for the Asciiverse catalog: one archive per target,
# solitty-<target>.tar.gz, plus SHA256SUMS, attached to a GitHub release
# (hub/catalog/SCHEMA.md, release.source = "github"). Runs on a pushed tag,
# or by hand for an existing tag.
#
# On the pattern of nInvaders'. Linux builds run in Alpine and link ncurses
# statically, so the binaries carry the -musl triple av looks for first and
# need no libncurses on the player's machine. macOS links the system
# ncurses. No Windows build: solitty is written for ncurses. The flags go in
# through the environment, so the Makefile's own CFLAGS and LDFLAGS are kept.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and test
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base ncurses-dev ncurses-static &&
            make clean &&
            CFLAGS=-O2 LDFLAGS="-static -s" make test solitty'
          sudo chown -R "$(id -u):$(id -g)" .
          file solitty

      - name: Package for av
        run: |
          # the binary sits at the top of the archive, where av looks for it
          mkdir -p stage dist
          cp solitty README LICENSE stage/
          tar -czf "dist/solitty-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          make clean
          CFLAGS="-O2 -arch ${{ matrix.arch }}" LDFLAGS="-arch ${{ matrix.arch }}" make solitty
          strip solitty
          file solitty

      - name: Package
        run: |
          mkdir -p stage dist
          cp solitty README LICENSE stage/
          tar -czf "dist/solitty-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "solitty $TAG" \
                 --notes "solitty $TAG, Murilo Pereira's ncurses Klondike, built for the Asciiverse catalog."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
